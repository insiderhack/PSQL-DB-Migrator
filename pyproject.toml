[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pg-migrator"
version = "1.0.0"
description = "Interactive PostgreSQL Migration Tool - Migrate from PG 14-17 to PG 18"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "PostgreSQL Migrator Team" }
]
keywords = ["postgresql", "migration", "database", "pg_upgrade"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "rich>=13.7.0",
    "click>=8.1.7",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "customtkinter>=5.2.2",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-psycopg2>=2.3.0",
]

[project.scripts]
pg-migrator = "pg_migrator.main:cli"

[project.urls]
Homepage = "https://github.com/example/pg-migrator"
Documentation = "https://github.com/example/pg-migrator#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_migrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psycopg2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "customtkinter.*"
ignore_missing_imports = true
